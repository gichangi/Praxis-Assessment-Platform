project_id = "assessment-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false

[edge_runtime]
enabled = true

[functions.sync]
verify_jwt = true

[functions.publish-form]
verify_jwt = true

[functions.invite-user]
verify_jwt = true

[functions.export]
verify_jwt = true

[functions.support-report]
verify_jwt = true

[functions.sheets-sync]
verify_jwt = false   # invoked by cron with no user JWT
schedule = "0 2 * * *"   # daily at 02:00 UTC

[analytics]
enabled = false
